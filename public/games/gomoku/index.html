<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五子棋</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fffcf5;color:#563f2d;font:11px 'Microsoft YaHei',sans-serif}.table{height:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:4px}canvas{display:block;touch-action:none;outline-offset:-2px;border-radius:5px}.controls{width:106px;display:flex;flex-direction:column;gap:7px}h1{font-size:14px;margin:0}p{font-size:10px;line-height:1.4;margin:0;color:#8b745f}button,select{font:inherit;width:100%;height:23px;border:1px solid #eadfce;border-radius:4px;background:#f7eddd;color:#563f2d;cursor:pointer}.actions{display:flex;gap:4px}#status{font-size:11px;color:#563f2d;min-height:15px}canvas:focus-visible{outline:2px solid #ac633d}
</style></head><body><main class="table"><canvas id="board" tabindex="0" aria-label="五子棋棋盘，方向键选择位置，回车落子"></canvas><div class="controls"><h1>五子棋</h1><select id="mode" aria-label="对局模式"><option value="ai">与电脑对弈</option><option value="local">本地双人</option></select><p id="status" role="status"></p><div class="actions"><button id="reset">新一局</button><button id="undo">悔棋</button></div><p>黑棋先行，五子连线胜。<br>点击棋盘落子。</p></div></main><script src="game.js"></script></body></html>
